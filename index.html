  :root{
    --blue:#394EFF; --yellow:#E3FD54; --cyan:#9EE8FF;
    --purple:#AA69FF; --magenta:#FB03E8; --pink:#FE82F4;
    --dark:#2E2E2E; --cream:#F5F5E4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--dark);color:var(--cream);
    font-family:"Switzer",system-ui,-apple-system,"Segoe UI",sans-serif;
    letter-spacing:-.01em;
    overflow:hidden;min-height:100svh;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:crosshair}

  main{
    position:relative;z-index:1;pointer-events:none;
    min-height:100svh;
    display:grid;grid-template-rows:auto 1fr auto;
    padding:clamp(20px,3.5vw,48px) clamp(16px,4.5vw,64px);
  }
  header{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .logo{width:clamp(96px,11vw,150px);height:auto;display:block}
  .tag{
    font-weight:500;font-size:clamp(13px,1.1vw,16px);
    border:1.5px solid var(--cream);border-radius:999px;padding:.5em 1.1em;white-space:nowrap
  }
  .tag .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--yellow);margin-right:.55em;vertical-align:.05em;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.2}}

  .hero{align-self:center;text-align:center}
  h1{
    font-family:"Archivo Condensed","Arial Narrow",sans-serif;
    font-weight:800;
    font-size:clamp(68px,15vw,250px);
    line-height:.86;letter-spacing:-.05em;
    color:var(--cream);
  }
  h1 .line{display:block;white-space:nowrap}
  .ico{
    display:inline-block;height:.62em;width:auto;vertical-align:.02em;margin:0 .06em;
    pointer-events:auto;cursor:pointer;
    transition:transform .45s cubic-bezier(.34,1.8,.5,1);
  }
  .ico path{transition:fill .25s}
  .ico:hover,.ico.on{transform:rotate(var(--rot,25deg)) scale(1.12)}
  .ico.i1{animation:bob 4.5s ease-in-out infinite}
  .ico.i2{animation:bob 5.2s ease-in-out -1.4s infinite}
  @keyframes bob{50%{translate:0 -.06em}}
  .by{
    margin-top:clamp(18px,2.6vw,34px);
    font-weight:500;font-size:clamp(15px,1.5vw,21px);color:var(--cream);opacity:.8
  }

  footer{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px 24px;
    font-weight:500;font-size:clamp(13px,1.05vw,15px);color:var(--cream)
  }
  .hint{display:flex;align-items:center;gap:.7em}
  .score{
    display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;height:2.1em;padding:0 .7em;
    border-radius:999px;background:var(--yellow);color:var(--dark);
    font-family:"Archivo Condensed",sans-serif;font-weight:800;font-size:1.2em;letter-spacing:-.02em;
    transition:transform .15s
  }
  .score.bump{transform:scale(1.25)}
  .copy{opacity:.7}

  @media (max-width:560px){.tag{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    {w:131,h:109,d:"M129.075 41.9532C126.264 38.0774 120.743 36.5867 113.617 37.183C117.029 29.8785 117.632 23.4685 114.52 19.1951C110.706 13.8783 102.023 12.7851 90.9817 15.2696C91.8349 11.195 91.4334 7.61732 89.5263 4.93405C82.249 -5.10336 56.8035 0.660696 32.6127 17.8038C8.42189 34.8972 -5.32972 56.91 1.94759 66.9474C4.60758 70.6741 9.82717 72.2145 16.5022 71.817C13.3905 78.8233 12.989 84.8855 16.0003 89.0098C19.915 94.426 28.8987 95.4695 40.2413 92.836C39.1372 97.3081 39.4383 101.184 41.496 104.066C48.7733 114.103 74.269 108.339 98.4096 91.1962C122.55 74.0531 136.302 52.0403 129.075 42.0029V41.9532Z"},

  ].map(s => ({...s, p:new Path2D(s.d)}));
  const COLORS = ["#E3FD54","#9EE8FF","#AA69FF","#FE82F4","#394EFF"];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, shapes = [], bits = [], score = 0;
  const mouse = {x:-999, y:-999, vx:0, vy:0, active:false};

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const target = Math.round(Math.max(6, Math.min(12, W*H / 110000)));
    while (shapes.length < target) shapes.push(make());
    shapes.length = target;
  }
  function make(){
    const base = Math.min(W,H);
    const size = Math.max(48, base * (0.05 + Math.random()*0.05));
    const ang = Math.random()*Math.PI*2, sp = 0.25 + Math.random()*0.45;
    return {
      t: Math.floor(Math.random()*SHAPES.length),
      c: Math.floor(Math.random()*COLORS.length),
      x: Math.random()*W, y: Math.random()*H,
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      r: Math.random()*Math.PI*2, vr: (Math.random()-.5)*0.01,
      size, s: 1, sv: 0, hot: 0, cool: 0
    };
  }
  function hit(sh){
    const dx = sh.x - mouse.x, dy = sh.y - mouse.y;
    return dx*dx + dy*dy < (sh.size*0.5)*(sh.size*0.5);
  }
  function pop(sh){
    sh.c = (sh.c + 1 + Math.floor(Math.random()*(COLORS.length-1))) % COLORS.length;
    if (Math.random() < .5) sh.t = (sh.t + 1) % SHAPES.length;
    sh.sv = 0.18;                       // squash & bounce
    const dx = sh.x - mouse.x, dy = sh.y - mouse.y, d = Math.hypot(dx,dy) || 1;
    const push = 4 + Math.min(10, Math.hypot(mouse.vx, mouse.vy)*0.35);
    sh.vx += dx/d*push + mouse.vx*0.15; sh.vy += dy/d*push + mouse.vy*0.15;
    sh.vr += (Math.random()-.5)*0.25;
    sh.cool = 22;
    for (let i=0;i<10;i++){
      const a = Math.random()*Math.PI*2, v = 2 + Math.random()*5;
      bits.push({x:sh.x,y:sh.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:COLORS[sh.c],r:Math.random()*Math.PI,t:Math.floor(Math.random()*SHAPES.length),size:sh.size*(0.08+Math.random()*0.1)});
    }
    score++;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump'); setTimeout(()=>scoreEl.classList.remove('bump'),140);
    const m = {10:"Nice touch",25:"You've got the senses",50:"Senses: unlocked",100:"Okay, you're officially in"}[score];
    if (m) msgEl.textContent = m;
  }
  function drawShape(t, x, y, size, rot, scale, color, alpha){
    const S = SHAPES[t], k = size / Math.max(S.w, S.h) * scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
    ctx.translate(-S.w/2, -S.h/2);
    ctx.fillStyle = color; ctx.fill(S.p);
    ctx.restore();
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    for (const sh of shapes){
      // cursor field: gentle repel when near
      if (mouse.active){
        const dx = sh.x - mouse.x, dy = sh.y - mouse.y, d = Math.hypot(dx,dy), R = sh.size*1.4;
        if (d < R && d > 0){ const f = (1 - d/R)*0.6; sh.vx += dx/d*f; sh.vy += dy/d*f; }
        if (sh.cool <= 0 && hit(sh)) pop(sh);
      }
      if (sh.cool > 0) sh.cool--;
      // drift back toward a calm speed
      const sp = Math.hypot(sh.vx, sh.vy);
      if (sp > 0.6){ sh.vx *= 0.975; sh.vy *= 0.975; }
      sh.vr *= 0.985; if (Math.abs(sh.vr) < 0.003) sh.vr += (Math.random()-.5)*0.002;
      sh.x += sh.vx; sh.y += sh.vy; sh.r += sh.vr;
      // walls
      const m = sh.size*0.45;
      if (sh.x < m){ sh.x = m; sh.vx = Math.abs(sh.vx); }
      if (sh.x > W-m){ sh.x = W-m; sh.vx = -Math.abs(sh.vx); }
      if (sh.y < m){ sh.y = m; sh.vy = Math.abs(sh.vy); }
      if (sh.y > H-m){ sh.y = H-m; sh.vy = -Math.abs(sh.vy); }
      // spring for squash
      sh.sv += (1 - sh.s)*0.18; sh.sv *= 0.78; sh.s += sh.sv;
      drawShape(sh.t, sh.x, sh.y, sh.size, sh.r, sh.s, COLORS[sh.c], 1);
    }
    for (let i=bits.length-1;i>=0;i--){
      const b = bits[i];
